name: Initialize Flutter Project

on:
  workflow_dispatch:

jobs:
  init:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter skeleton
        run: |
          if [ -f README.md ]; then cp README.md README.md.bak; fi
          flutter create . --project-name ayman --org com.ayman.app --platforms android,web
          if [ -f README.md.bak ]; then mv README.md.bak README.md; fi

      - name: Commit and Push files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Initialize Flutter project structure for Android and Web" || echo "No changes to commit"
          git push
